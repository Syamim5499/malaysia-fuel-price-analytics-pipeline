x-airflow-common: &airflow-common
  build: ./airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@airflow-db:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    WAREHOUSE_DSN: postgresql://warehouse:${POSTGRES_PASSWORD}@warehouse:5432/warehouse
  volumes:
    - ./dags:/opt/airflow/dags
    - ./pipeline:/opt/airflow/dags/pipeline
  depends_on:
    airflow-db:
      condition: service_healthy
    warehouse:
      condition: service_healthy

services:
  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U airflow -d airflow']
      interval: 5s
      retries: 12

  warehouse:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: warehouse
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - warehouse_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U warehouse -d warehouse']
      interval: 5s
      retries: 12

  airflow-init:
    <<: *airflow-common
    command: >-
      bash -c 'airflow db migrate && airflow users create
      --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}"
      --firstname Demo --lastname Admin --role Admin --email demo@example.com'
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    restart: 'no'

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  dashboard:
    build: ./dashboard
    environment:
      WAREHOUSE_DSN: postgresql://warehouse:${POSTGRES_PASSWORD}@warehouse:5432/warehouse
    ports:
      - '127.0.0.1:8501:8501'
    depends_on:
      warehouse:
        condition: service_healthy

volumes:
  airflow_db:
  warehouse_db:
